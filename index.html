<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחברת המתכונים שלי</title>
<meta name="theme-color" content="#efe5d0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">

<header class="site-header">
  <div class="wrap header-in">
    <a class="logo" href="index.html" aria-label="מחברת המתכונים שלי – לעמוד הבית"><span class="logo-name">מחברת המתכונים שלי</span></a>
    <span class="h-rule arrow" aria-hidden="true"></span>
    <nav class="main-nav" id="main-nav" aria-label="ניווט ראשי">
      <a href="index.html" data-nav="home">הבית</a>
      <a href="index.html#recipes" data-nav="recipes">המתכונים</a>
      <a href="index.html?cat=favorites#recipes" data-nav="favorites" data-cat="favorites">מועדפים</a>
      <button class="nav-random" type="button" data-random>מתכון אקראי ←</button>
    </nav>
    <span class="h-rule" aria-hidden="true"></span>
    <button class="btn btn-ghost header-cta" type="button" data-random>מתכון אקראי</button>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <span class="bars" aria-hidden="true"></span><span class="nav-toggle-label">תפריט</span>
    </button>
  </div>
</header>

<main>
  <section class="hero wrap" aria-labelledby="hero-title">
    <div class="hero-text">
      <h1 id="hero-title">מחברת<br>המתכונים<br>שלי</h1>
      <span class="short-rule" aria-hidden="true"></span>
      <div class="cta-row">
        <a class="btn" href="#recipes">לכל המתכונים ←</a>
        <a class="link-arrow" href="index.html?cat=favorites#recipes" data-cat="favorites">המועדפים שלי ←</a>
      </div>
    </div>
    <div class="hero-art"><div data-art="hero"></div></div>
  </section>

  <section class="band recipes" id="recipes" aria-label="המתכונים">
    <div class="wrap recipes-in">
      <div class="recipes-intro">
        <label class="search">
          <span class="visually-hidden">חיפוש מתכון</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
          <input type="search" id="search" placeholder="שם מתכון או מצרך..." autocomplete="off">
        </label>
        <nav class="tabs" id="tabs" aria-label="קטגוריות"></nav>
        <p class="status" id="status" role="status"></p>
      </div>
      <div class="cards" id="grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-in">
    <a class="logo" href="index.html"><span class="logo-name">מחברת המתכונים שלי</span></a>
  </div>
</footer>

<script src="data/recipes.js"></script>
<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
